name: 建议新功能
description: 说明你想解决的实际问题和理想结果
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        好的功能建议不需要先设计技术方案。请先告诉我们：谁在什么场景下遇到了什么问题。

        请不要上传真实医疗数据。如果只能使用真实敏感内容说明问题，请改用“申请私下联系”。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 说明使用者、使用时机和当前的困难
      placeholder: 例如：科室每周复盘时需要比较最近四周的手术量，目前只能按月查看……
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 理想的结果是什么？
      description: 描述你希望看到或完成的事，不需要写代码
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: 合成示例（可选）
      description: 可以提供几行完全合成的 CSV、简图或脱敏截图，帮助说明场景

  - type: textarea
    id: alternatives
    attributes:
      label: 你现在是怎么做的？（可选）
      description: 如果有临时做法或考虑过其他方案，可以简单说明

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认本 Issue 及其附件不包含真实患者、医务人员、医院内部信息或其他敏感数据
          required: true
