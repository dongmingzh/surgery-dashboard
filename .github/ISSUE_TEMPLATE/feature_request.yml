name: 建议新功能
description: 为项目提出一个改进建议或新功能
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你的业务场景，并在必要时附上 **脱敏示例数据**。

  - type: textarea
    id: scenario
    attributes:
      label: 业务场景
      description: 描述你遇到的业务场景或管理需求。这个功能解决什么问题？在什么情况下使用？
      placeholder: |
        例如：科室每周一开晨会时需要看上周各医疗组的手术排班完成情况，但目前的月度趋势图……
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: 脱敏示例数据（可选但强烈推荐）
      description: |
        如有示例数据，请使用 **完全合成或脱敏后的数据** 来说明。数据中不能包含真实患者姓名、医务人员姓名、住院号、病案号等真实医疗数据。
        你可以直接从看板导出 CSV 后稍加编辑，或手动编写几行示例。
      placeholder: |
        示例 CSV（字段可以任选）：
        手术日期,医疗组,手术医生,手术名称,手术分类
        2026-03-03,一组,医生A,胸腔镜肺叶切除术,肺部手术
        2026-03-03,二组,医生B,食管癌根治术,食管手术

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 描述你期望的解决方案或功能表现
      placeholder: 例如：在月度趋势图下方增加一个"周度对比"子图……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你是否考虑过其他实现方式？目前有什么临时绕过的做法？
      placeholder: 目前我们手动从明细表复制到 Excel 里做……

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      description: 确认你提供的信息不含真实医疗数据
      options:
        - label: 我确认在本 Issue 中提供的所有示例数据和截图均为脱敏或合成数据，不包含真实患者、医务人员或医院标识信息
          required: true

  - type: markdown
    attributes:
      value: |
        ---
        ⚠️ **隐私提醒**：请确认你提交的内容中 **不包含任何真实患者信息、医务人员姓名或医院标识**。如不慎包含，请按 [SECURITY.md](https://github.com/dongmingzh/surgery-dashboard/blob/main/SECURITY.md) 处理。
